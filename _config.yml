
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "default"

title: "AWNT"        
description:        Portfolio
author:             AWNT
baseurl:            ""
url:                "https://awnt.github.io"

# Social Profiles
github_username:    
linkedin_username:

# Add your google-analytics ID here to activate google analytics
# google_analytics:   UA-XXXXXXXXX-X # out your google-analytics code

# Build settings
remote_theme: mmistakes/minimal-mistakes
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  parse_block_html: true
paginate:           5
paginate_path:      "/posts/page:num/"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: true
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
