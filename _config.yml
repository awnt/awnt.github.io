remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "default"

title: "AWNT"
description: "Portfolio"
baseurl: ""
url: "https://awnt.github.io"

# Site Favicon
favicon: "/favicon.ico"
# Profile Sidebar Settings
author:
  name: "AWNT"
  bio: "Portfolio and Curiosity Space"
  # location: "Bangkok, Thailand"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/awnt"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/awasada"



# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  parse_block_html: true

paginate: 5
paginate_path: "/posts/page:num/"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: true

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap